name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: memory_service
          POSTGRES_PASSWORD: memory_service
          POSTGRES_DB: memory_service
        ports:
          - 5432:5432
        # wait until Postgres accepts connections before running the steps
        options: >-
          --health-cmd "pg_isready -U memory_service"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://memory_service:memory_service@localhost:5432/memory_service

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Django checks
        run: uv run python manage.py check

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: uv run pytest --cov=core --cov-report=term-missing:skip-covered
