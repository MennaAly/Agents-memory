[project]
name = "memory-service"
version = "0.1.0"
description = "Multi-tenant long-term memory service for AI agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.28",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

# uv: this is an application, not a library to publish, so don't try to build/install it as a package.
[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
# Migrations are generated by Django; don't lint or reformat them.
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
# E/F = pyflakes + pycodestyle basics, I = import sorting, B = common bug patterns,
# UP = modern Python syntax, DJ = Django-specific checks
select = ["E", "F", "I", "B", "UP", "DJ"]
